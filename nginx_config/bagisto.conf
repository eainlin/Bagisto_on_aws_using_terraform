server {
    listen 80;
    listen [::]:80;

    # Replace with your domain name or public IP address
    server_name bagisto.infrasky.online;

    # Bagisto requires pointing directly to the /public directory
    root /home/ubuntu/bagisto/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Secure headers for Laravel/Bagisto
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # NOTE: Update the php-fpm version socket below to match your installed PHP version!
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.ht {
        deny all;
    }

    # Optimize caching for static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}